# Ferralon Assay — free, deterministic dependency-advisory scan, run in this
# repository's own GitHub runner.
#
# The app is Ferralon; the free-scan operation it performs is the Assay — so the
# customer-facing name is "Ferralon Assay". It stays Ferralon-branded by construction:
# never the engine codename, and never the engine's "Nucleon" stealth placeholder. Keep
# this name in sync with FERRALON_SCAN.md.
#
# What it does, in the runner (no source leaves the repo):
#   1. runs the Ferralon scanner over this Go module -> a schema-valid tegron.report.v1
#      report.json (the neutral scan spine);
#   2. on the default branch, persists the StateStore to refs/tegron/state (the ref the
#      backend's in-repo reader keys off — pinned by cross-team contract, ADR-0015);
#   3. on the default branch, pushes the FULL report.json to the backend's run-snapshot
#      endpoint (OIDC /runs) and captures the returned {handle, run_id} — the durable,
#      addressable record of this specific run (ADR 0023 D5);
#   4. files a Ferralon-branded, codename-free pivot Issue linking to the console — both
#      the baseline bookmark and the frozen run-scoped view, from the handle + run_id above;
#   5. POSTs a thin metadata allowlist (no source / no PII) to the backend's OIDC ingest
#      endpoint — fires automatically on every default-branch run against the deployed
#      backend (the endpoint is a known default; a repo/org var can override).
#
# The scanner's OWN Tier-1 surfaces (its generic pinned Issue / sticky PR comment / SARIF
# upload) are turned OFF — Ferralon owns the customer-facing surfaces (the pivot Issue
# above). The scanner is DELIVERED by the pinned, checksummed `ferralon-ai/ferralon-assay`
# Action (SHA-pinned below) which fetches a versioned scanner release at run time and
# checksum-verifies it — no scanner binary is committed to this repo. (Previously the
# binaries were vendored under bin/; that shortcut is retired — see FERRALON_SCAN.md.)

name: Ferralon Assay

on:
  # Top of funnel: the assessment is scheduled + on-demand dispatchable (the App will
  # dispatch on its own schedule; for the demo the daily cron + workflow_dispatch stand
  # in). A push also refreshes posture, and a pull_request is the per-change check. Which
  # events MUTATE the repo singletons is decided by the default-branch gate below, not by
  # this trigger list — so the triggers stay broad and the gate stays the single guard.
  schedule:
    - cron: "17 7 * * *"   # daily, deliberately off the top of the hour
  workflow_dispatch:
  push:
    # Scope push to the default branch so a branch that already has an open PR doesn't
    # raise BOTH a push and a pull_request check on the same SHA (two identical "assess"
    # checks). pull_request is the per-change check while a PR is open; this push refreshes
    # the baseline posture once a change merges. NOTE: trigger branches: filters can't use a
    # ${{ ...default_branch }} expression, so the default branch is hardcoded here — if the
    # demo repo's default branch ever changes from "vulnerable", update this filter in lockstep.
    branches: [vulnerable]
  pull_request:

permissions:
  contents: read

jobs:
  assess:
    # Branded display name for the per-commit status check (the job id stays `assess`;
    # this `name:` is what surfaces to users on the PR/commit). Kept in sync with the
    # workflow `name:` above and FERRALON_SCAN.md's branding-name note.
    name: Ferralon Assay
    runs-on: ubuntu-latest
    permissions:
      contents: write      # persist the StateStore ref (refs/tegron/state) on the default branch
      issues: write        # file/update the Ferralon pivot Issue
      id-token: write       # request the GitHub Actions OIDC token for the ingest POST
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: false

      - name: Warm the module cache for this module
        # The scanner's Go analyzer loads the module with go/packages, which needs the
        # module graph resolvable on the runner — warm the cache before the scan.
        run: go build ./...

      - name: Run the Ferralon Assay
        id: scan
        # Pinned, checksummed scanner delivery. `@<sha>` SHA-pins the Action; the Action's
        # own scanner-version + scanner-sha256 defaults pin the exact scanner bytes it fetches
        # (transitive pin), and its drift guard fails the run loud on any checksum mismatch.
        # PENDING PIN: the SHA below is a placeholder — it goes live once the Operator publishes
        # ferralon-ai/ferralon-assay + cuts the scanner release (deploy/assay/publish.sh --execute)
        # and fills scanner-version/scanner-sha256 in the Action. See the TEG-015 Operator handoff.
        uses: ferralon-ai/ferralon-assay@c58196ddbd4ff56c2ec163a5b388e7ffe514cea6
        with:
          mode: baseline
          target: .
          out: ${{ runner.temp }}/out
          subject-repo: ${{ github.repository }}
          revision: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          # Persist the durable StateStore ref only on the default branch (the baseline
          # posture). A PR run — github.ref_name is "<n>/merge" — stays stateless (no state-repo),
          # so it never overwrites the baseline. state-ref is the backend's cross-team contract ref.
          state-ref: refs/tegron/state
          state-repo: ${{ github.ref_name == github.event.repository.default_branch && github.repository || '' }}
          # Turn OFF the scanner's own customer-facing surfaces — Ferralon files its own pivot
          # Issue below. (The Action maps these onto the fetched build's toggle prefix.)
          issue: "false"
          pr-comment: "false"
          code-scanning: "false"

      - name: Branding wall — codename absent from authored surfaces
        run: ./.ferralon/check_branding.sh

      - name: Upload the scan report bundle (build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ferralon-scan-report
          path: |
            ${{ steps.scan.outputs.out-dir }}/report.json
            ${{ steps.scan.outputs.out-dir }}/openvex.json
          if-no-files-found: error

      - name: Push the full run snapshot to the Ferralon /runs endpoint
        # Runs BEFORE the pivot Issue: it POSTs the full report.json to the run-snapshot
        # endpoint (api.ferralon.com/runs) and returns the backend-minted {handle, run_id}
        # the Issue links to. Same OIDC token + audience as the ingest step below; the body
        # is the FULL tegron.report.v1 report (stored verbatim), not the thin ingest
        # allowlist. Default-branch only (the baseline is what gets a durable, addressable
        # run). The endpoint/audience are known constants (our own infrastructure in code),
        # defaulted here and in post_runs.sh; a repo/org var (FERRALON_RUNS_URL /
        # FERRALON_RUNS_AUD) can override for testing. Fails the step on any non-200 — the
        # Issue step that consumes its outputs never runs without a real handle + run_id.
        id: runs_push
        if: github.ref_name == github.event.repository.default_branch
        env:
          FERRALON_RUNS_URL: ${{ vars.FERRALON_RUNS_URL || 'https://api.ferralon.com/runs' }}
          FERRALON_RUNS_AUD: ${{ vars.FERRALON_RUNS_AUD || 'ferralon-ingest' }}
          REPORT: ${{ steps.scan.outputs.out-dir }}/report.json
        run: ./.ferralon/post_runs.sh

      - name: File the Ferralon pivot Issue
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.scan.outputs.out-dir }}/report.json
          # The backend-minted handle + authoritative run_id from the run-snapshot push —
          # the Issue composes its two run-addressable console links from these.
          FERRALON_RUN_HANDLE: ${{ steps.runs_push.outputs.handle }}
          FERRALON_RUN_ID: ${{ steps.runs_push.outputs.run_id }}
        run: ./.ferralon/file_pivot_issue.sh

      - name: POST the thin allowlist to the Ferralon OIDC ingest
        # Fires on every default-branch run against the deployed backend
        # (api.ferralon.com/ingest). The endpoint and audience are known constants — our
        # own infrastructure in code — defaulted here and in post_ingest.sh (its ':-'
        # defaults); a repo/org var (FERRALON_INGEST_URL / FERRALON_INGEST_AUD) can still
        # override for testing. This step is NOT a security control: post_ingest.sh
        # requests a GitHub Actions OIDC token and the backend binds the token's
        # repository_owner_id to an ACTIVE install (403 otherwise) — install state, not
        # this step, is the real guard.
        if: github.ref_name == github.event.repository.default_branch
        env:
          FERRALON_INGEST_URL: ${{ vars.FERRALON_INGEST_URL || 'https://api.ferralon.com/ingest' }}
          FERRALON_INGEST_AUD: ${{ vars.FERRALON_INGEST_AUD || 'ferralon-ingest' }}
          REPORT: ${{ steps.scan.outputs.out-dir }}/report.json
        run: ./.ferralon/post_ingest.sh
